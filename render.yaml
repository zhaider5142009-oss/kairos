services:
  - type: web
    name: kairos-tower
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: KAIROS_TOKEN        # gates every path except /api/health, reads too
        generateValue: true
      # The JS Global bridge is drivable from secrets instead of config.yaml.
      # Only add these on a server you control: with JSG_ALLOW_ORDERS=1 and a
      # JSG_PIN present, this host can place REAL orders on your PSX account.
      # - key: JSG_PORTAL          # default https://wt.jsglobalonline.com
      #   value: "https://wt.jsglobalonline.com"
      # - key: JSG_LOGIN           # account number
      #   value: ""
      # - key: JSG_PASSWORD
      #   value: ""
      # - key: JSG_PIN             # broker second factor — money-moving secret
      #   value: ""
      # - key: JSG_ALLOW_ORDERS    # "" / unset = orders refused (fail-closed)
      #   value: ""
      # - key: JSG_ORDER_ACCOUNT   # account NUMBER the orders are placed for
      #   value: ""
