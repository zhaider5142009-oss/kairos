Version: "2.6.2"
Codename: "Institutional"

app:
  name: KAIROS
  data_dir: data
  cache_dir: data/cache
  reports_dir: reports
  log_level: INFO

market_hours:
  psx_tz: "Asia/Karachi"
  psx_open: "09:30"
  psx_close: "15:30"
  psx_days: [0, 1, 2, 3, 4]

# ---------------------------------------------------------------------------
# API keys. Copy this file to config.yaml and fill in your own values.
# config.yaml is git-ignored — NEVER commit real keys.
# ---------------------------------------------------------------------------
apis:
  psx_local:
    base_url: "http://localhost:8000/api/stock"
    enabled: true

  openrouter:
    enabled: true
    base_url: "https://openrouter.ai/api/v1"
    keys:
      - "sk-or-v1-YOUR-KEY-1"
      - "sk-or-v1-YOUR-KEY-2"
      - "sk-or-v1-YOUR-KEY-3"
    # Every slug below was checked against OpenRouter's live catalog on
    # 2026-10-19. Vendor slugs do rot (meta-llm/llama-3.3-70b-instruct and
    # deepseek/deepseek-r1 are both gone), so verify with `python -m kairos.cli
    # llm-health` after changing this list — a dead seat quietly shrinks the
    # council instead of failing loudly.
    council_models:
      - "deepseek/deepseek-chat-v3-0324"
      - "meta-llama/llama-4-scout"
      - "qwen/qwen-2.5-72b-instruct"
      - "moonshotai/kimi-k3"
    fast_model: "deepseek/deepseek-chat-v3-0324"
    deep_model: "deepseek/deepseek-r1-0528"
    timeout_s: 90

  # Kimi (Moonshot AI) — direct 262k-context reasoning models.
  # Keys are region-bound: a global (platform.moonshot.ai) key is rejected by
  # api.moonshot.cn and vice versa. Override with MOONSHOT_API_KEY / KIMI_API_KEY.
  # Council entries are prefixed "kimi:" so they route here instead of OpenRouter.
  moonshot:
    enabled: false
    base_url: "https://api.moonshot.ai/v1"
    api_key: "YOUR-MOONSHOT-KEY"
    model: "kimi-k2.6"
    council_models:
      - "kimi-k2.6"
    timeout_s: 90

  deepseek:
    enabled: false
    base_url: "https://api.deepseek.com"
    api_key: "YOUR-KEY"
    model: "deepseek-chat"

  gemini:
    enabled: false
    base_url: "https://generativelanguage.googleapis.com/v1beta"
    api_key: "YOUR-KEY"
    model: "gemini-2.0-flash"

  zai:
    enabled: false
    base_url: "https://api.z.ai/api/paas/v4"
    api_key: "YOUR-KEY"
    model: "glm-4-flash"

  grok:
    enabled: false
    base_url: "https://api.x.ai/v1"
    api_key: "YOUR-KEY"
    model: "grok-3-mini"

  ibm_quantum:
    enabled: false
    token: "YOUR-TOKEN"
    channel: "ibm_quantum_platform"

# ---------------------------------------------------------------------------
# Binance spot — the third venue (crypto).
#   kairos/binance.py  public klines (no key needed), the signed balance read,
#   and the order bridge — but an order needs BOTH keys below AND an API key
#   that the exchange itself permits to trade. A read-only key is reported as
#   read-only instead of discovered as a rejection.
# Put real credentials ONLY in the git-ignored config.yaml, never here.
#
# Same values work as environment variables for headless deploys:
#   BINANCE_API_KEY / BINANCE_SECRET        — the key pair
#   BINANCE_ALLOW_ORDERS=1                  — the standing "orders allowed" key
#   BINANCE_BASE_URL                        — alternate host (testnet etc.)
#
# A signed Binance URL contains the signature, so it IS a credential: every
# failure text this module produces is redacted before it can reach a log, a
# journal row or a terminal. Rotate a key the moment it has been pasted into
# anything — chat, an issue, a screenshot.
# ---------------------------------------------------------------------------
binance:
  api_key: "YOUR-API-KEY"
  secret_key: "YOUR-SECRET-KEY"
  base_url: "https://api.binance.com"

  # THE key — standing permission for KAIROS to place crypto orders at all.
  # false = place_order refuses before any network call.
  allow_orders: false

  timeout_s: 15

# ---------------------------------------------------------------------------
# JS Global Securities (PSX broker) web terminal.
#   kairos/jsgsync.py  reads the real book (READ-ONLY endpoints only)
#   kairos/jsgtrade.py places orders — but ONLY if you turn both keys below.
# Put real credentials ONLY in the git-ignored config.yaml, never here.
#
# Headless deploys carry the same values as environment variables instead of
# a config.yaml at all (the Docker image ships without one):
#   JSG_PORTAL / JSG_LOGIN / JSG_PASSWORD     — bridge login
#   JSG_PIN                                   — trading PIN (enables auto-place)
#   JSG_ALLOW_ORDERS=1                        — the standing "orders allowed" key
#   JSG_ORDER_ACCOUNT                         — account NUMBER the order is for
# ---------------------------------------------------------------------------
js_global:
  portal_url: "https://wt.jsglobalonline.com"
  login: "YOUR-ACCOUNT-NUMBER"
  password: "YOUR-PASSWORD"

  # KEY 1 — standing permission for KAIROS to touch the broker at all.
  # false = every stage/ack/cancel refuses before any network call.
  allow_orders: false
  # KEY 2 — the broker's own second factor for PlaceOrder. Leave "" to type it
  # per order on the desk; the desk button "Store PIN for unattended live"
  # writes this line for you (never logged or echoed) and "Forget PIN" clears
  # it. A stored PIN is what lets the armed autopilot place without you — only
  # do that deliberately, and never commit it.
  trading_pin: ""
  order_account: ""              # account NUMBER, e.g. 90001; "" = first the
                                 # portal returns for this login
  market: "REG"                  # REG | FUT | ODL | SIF | SQR | FSR
  max_order_notional: 250000     # PKR ceiling per single order (staging rejects above)

# Pakistan Mercantile Exchange (futures) — fill when the account opens.
# Empty values keep KAIROS in scaffold mode; tickets stay human-confirmed.
pmx:
  broker: ""
  account: ""

data:
  yahoo:
    enabled: true
    base_url: "https://query1.finance.yahoo.com"
    lookback_days: 730
    timeout_s: 20
  tradingview:
    enabled: true
    scanner_url: "https://scanner.tradingview.com/pakistan/scan"
    global_scanner_url: "https://scanner.tradingview.com/global/scan"
    timeout_s: 25

news:
  enabled: true
  feeds:
    - name: "Google News - Pakistan Stocks"
      url: "https://news.google.com/rss/search?q=Pakistan+Stock+Exchange+OR+KSE-100+when:2d&hl=en-PK&gl=PK&ceid=PK:en"
    - name: "Google News - Commodities"
      url: "https://news.google.com/rss/search?q=gold+OR+oil+OR+commodities+market+when:1d&hl=en&gl=US&ceid=US:en"
    - name: "Google News - Global Markets"
      url: "https://news.google.com/rss/search?q=stock+market+OR+fed+OR+inflation+when:1d&hl=en&gl=US&ceid=US:en"
    - name: "Business Recorder"
      url: "https://www.brecorder.com/feeds/latest-news"
    - name: "Dawn Business"
      url: "https://www.dawn.com/feeds/home-business"
    - name: "FXStreet"
      url: "https://www.fxstreet.com/rss/news"
    - name: "MarketWatch Top"
      url: "https://feeds.content.dowjones.io/public/rss/mw_topstories"
  max_items_per_feed: 25

# The news desk: a per-instrument headline tone, scored by a declared lexicon,
# cached, and read (never fetched) on the prediction path. This is the floor
# under the LLM's `news_sentiment` — it needs no key and no model, so "News
# Sentiment Tilt" votes on a machine where OpenRouter is switched off, and stops
# voting only when the host is genuinely not answering. Every number below is
# judgment or measurement, not a fitted parameter; the reasons are in kairos/news.
newsdesk:
  enabled: true
  # Days of headlines to keep. The feed query is bounded by `when:<n>d`, so this
  # is both the freshness window and the query.
  window_d: 2
  # How long a reading stays usable. A cycle that finds a reading younger than
  # this does not re-ask the host for that symbol.
  ttl_s: 900
  # Per-query HTTP timeout. Measured 2026-10-23 on this machine's single uplink:
  # one query takes 3.7-5.1s alone and materially longer with four in parallel.
  timeout_s: 9
  # Parallel queries per batch. More workers do not make a 5s host answer
  # faster on one uplink; they only make each answer slower for the others.
  max_workers: 4

engine:
  min_history: 40
  forecast_horizons: [1, 5, 21]
  strategy_vote_threshold: 0.45
  model_confidence_floor: 0.30
  use_neural: true
  use_ml: true
  use_stat: true
  use_strategies: true
  use_llm: false
  llm_council_models: 3

risk:
  annual_vol_target: 0.18
  max_position_weight: 0.10
  max_sector_weight: 0.40
  var_confidence: 0.95
  kelly_fraction_cap: 0.25
  # One daily loss brake, expressed twice. This is a FRACTION of equity (0.03 =
  # 3%); rules.max_daily_loss_pct below is the same instruction as a PERCENT.
  # The tighter of the two governs both the pre-trade gate and the autopilot's
  # entry breaker, and every refusal names the key that fired. A value that is
  # not a positive number is read as a limit of zero: no new orders.
  daily_loss_limit_pct: 0.03
  psx_cost_bps: 60
  global_cost_bps: 12

quantum:
  enabled: true
  mode: "local"
  shots: 2048

backtest:
  train_window: 252
  step_days: 1
  refit_every: 20
  start_capital: 1000000

# MT5 live bridge — put your REAL credentials in config.yaml (git-ignored),
# never here. The terminal must be installed; leave login empty to simply
# attach to an already-signed-in terminal.
mt5:
  # Attach-only bridge to the desktop terminal. KAIROS reads `account_info()` and
  # refuses the link if the signed-in account is not the one below, so two MT5
  # installs on one machine cannot be confused for each other.
  venue: "your MT5 broker"          # PMEX, JS Markets, … — only used in messages
  login: 0
  password: ""
  server: ""                        # leave blank to attach to whatever is signed in
  terminal_path: "C:/Program Files/MetaTrader 5/terminal64.exe"
  # Let KAIROS start this terminal again if nobody opened it (a 24/7 loop cannot
  # depend on a GUI app). It launches the app only, never with credentials: the
  # account has to be saved inside the terminal itself. Off by default.
  spawn: false

# Trading doctrine overrides (see kairos/rules.py for the full parameter set;
# runtime overrides also possible via data/rules.json)
rules:
  max_risk_per_trade_pct: 2.0
  min_risk_reward_ratio: 2.0
  max_position_pct: 15.0
  # institutional circuit breakers (autopilot pauses ENTRIES; exits always run)
  # PERCENT, not fraction — same brake as risk.daily_loss_limit_pct above.
  # Whichever of the two is tighter is the one that stops the next order.
  max_daily_loss_pct: 3.0            # stop opening after a -3% day
  max_total_exposure_pct: 60.0       # gross exposure ceiling
  max_consecutive_losses: 4          # cool off entries after 4 red trades
  min_model_agreement: 0.55          # require 55% of models to concur
  max_spread_pct: 0.60               # live MT5 entry crossing-cost guard
  trail_after_r_multiples: 1         # start ratcheting the stop at +1R
  max_equity_drawdown_pct: 8.0       # cross-day peak guard: pause entries
                                     # when equity is 8%+ under its all-time peak
  psx_min_price: 5.0                 # PSX microstructure screen: no penny scrips
  psx_min_adv_shares: 50000          # PSX 20d avg volume floor (illiquid = tickets die)
  # ---- entry filters the gate applies (wired 2026-10-23) ----
  # These were declared in `kairos/rules.py` for eighteen months and read by
  # nothing, while `describe()` printed them as if they governed — and the CLI,
  # the command plane and the LLM council prompt all quote `describe()`. They now
  # bind: `kairos rules` shows a column saying so, and
  # `tests/test_doctrine_bound.py` fails if a declared key binds nothing and does
  # not admit it. Setting `require_above_sma50: false` is a real choice; leaving
  # it true means the system is obeying rule 3 of the doctrine it states.
  max_open_positions: 8              # no new name once the book holds 8
  require_above_sma50: true          # longs only at or above the mean below
  trend_sma_period: 50               # the mean the filter measures, and the one
                                     # `predict` publishes in `res["doctrine"]`
  rsi_overbought: 70                 # no long bought above this heat
  rsi_oversold: 30                   # no short sold below it
  max_hold_days: 60                  # second maturity brake: the tighter of this
                                     # and `autopilot.horizon_days` closes the name
  min_avg_volume: 50000              # PSX liquidity floor — same instruction as
                                     # `psx_min_adv_shares`, and the tighter of the
                                     # two is the one that screens (no more knob
                                     # that looks tightened and is not read)

# paper venue economics
paper:
  commission_bps: 8.0                # global non-PSX commission, bps of notional
  psx_commission_bps: 20.0           # PSX all-in (brokerage+GFSS+SECP+PSX+CDC) —
                                     # tune to your JS Global slab

# autopilot behavior
autopilot:
  auto_start_paper: true             # server boot (incl. deployed) resumes the PAPER loop
                                     # automatically; LIVE never self-arms (needs confirm)
  psx_auto_watch: true               # daily: rotate top-6 factor leaders from the
                                     # PSX cross-sectional scan into the watchlist
  auto_place: false                  # KEY 3 for autonomous PSX money. true ONLY when
                                     # mode=live AND js_global.allow_orders AND a
                                     # trading_pin is on file — then PSX orders go
                                     # straight to the broker instead of becoming
                                     # tickets you confirm. Any failure degrades
                                     # back to a ticket; nothing ever re-acks.

# public exposure (deployment): set env KAIROS_TOKEN on the server process;
# every POST/PUT/DELETE then demands X-KAIROS-Token. Reads stay public.
