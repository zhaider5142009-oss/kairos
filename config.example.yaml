# =============================================================================
# Jarvis — Predictive Trading System Configuration
# =============================================================================
# All settings live here. Override anything via JARVIS_CONFIG env var.

# -----------------------------------------------------------------------------
paths:
  root: "C:/Users/Haider/jarvis"
  logs_dir: "C:/Users/Haider/jarvis/logs"
  cache_dir: "C:/Users/Haider/jarvis/cache"
  model_cache: "C:/Users/Haider/jarvis/cache/models"

# -----------------------------------------------------------------------------
# TimesFM — deep time-series foundation model
# -----------------------------------------------------------------------------
timesfm:
  checkpoint: "google/timesfm-2.5-200m-pytorch"
  device: "cpu"
  per_core_batch_size: 16
  context_len: 512
  horizon: 16

# -----------------------------------------------------------------------------
# Technical indicators — RSI/MACD/ATR/volume profile
# -----------------------------------------------------------------------------
indicators:
  rsi_period: 14
  macd_fast: 12
  macd_slow: 26
  macd_signal: 9
  atr_period: 14
  volume_ma_period: 20

# -----------------------------------------------------------------------------
# Quantum-inspired layer — pure-numpy, no quantum hardware needed
# -----------------------------------------------------------------------------
quantum:
  enabled: true
  seed: 42
  qaoa_layers: 3
  qaoa_shots: 256
  qaoa_max_iter: 80
  amplitude_floor: 0.05    # below this, asset is ignored in amplitude vote
  use_entanglement: true   # correlation-matrix coupling

# -----------------------------------------------------------------------------
# Ensemble — weights per signal source (must sum to ~1.0; will renormalise)
# -----------------------------------------------------------------------------
ensemble:
  weights:
    models:      0.30   # the 12-model consensus below
    ta:          0.15
    quantum:     0.15
    news:        0.10
    intermarket: 0.10
    patterns:    0.10
    calendar:    0.10
    desk:        0.08   # commodities research desk
  min_confidence: 0.45

# -----------------------------------------------------------------------------
# Predictive models — 13+ independent forecasters.
# Every entry has: family (which adapter), enabled, weight, kwargs.
# Disabled models still appear in the registry with status="unavailable"
# so the ensemble can fall back gracefully.
# -----------------------------------------------------------------------------
models:
  # --- Foundation time-series models (deep) ---
  timesfm:
    family: timesfm
    enabled: true
    weight: 1.5
    kwargs:
      checkpoint: "google/timesfm-2.5-200m-pytorch"
      device: "cpu"
      context_len: 512
      horizon: 16
  chronos:
    family: chronos
    enabled: true
    weight: 1.4
    kwargs:
      variant: "bolt-tiny"   # smallest variant — fast on 8 Mbps
      device: "cpu"

  # --- Qlib ML zoo (Microsoft) — each algorithm is its own model ---
  qlib_lstm:
    family: qlib
    enabled: true
    weight: 0.9
    kwargs:
      algo: "lstm"
      epochs: 5
  qlib_gru:
    family: qlib
    enabled: true
    weight: 0.9
    kwargs:
      algo: "gru"
      epochs: 5
  qlib_alstm:
    family: qlib
    enabled: true
    weight: 1.0
    kwargs:
      algo: "alstm"
      epochs: 5
  qlib_transformer:
    family: qlib
    enabled: true
    weight: 1.0
    kwargs:
      algo: "transformer"
      epochs: 5
  qlib_tcn:
    family: qlib
    enabled: true
    weight: 0.9
    kwargs:
      algo: "tcn"
      epochs: 5
  qlib_localformer:
    family: qlib
    enabled: true
    weight: 0.9
    kwargs:
      algo: "localformer"
      epochs: 5
  qlib_lgbm:
    family: qlib
    enabled: true
    weight: 1.1
    kwargs:
      algo: "lgbm"

  # --- FinGPT (LLM-based forecaster + sentiment) ---
  # cadence: rerun inference only every N poll cycles (default for LLM
  # families is fleet.llm_cadence; set per model to override). Keeps the
  # network/LLM path off the hot loop → "ultra-efficient" polling.
  fingpt_forecaster:
    family: fingpt
    enabled: true
    weight: 1.0
    kwargs:
      kind: "forecaster"
      cadence: 6
  fingpt_sentiment:
    family: fingpt
    enabled: true
    weight: 0.8
    kwargs:
      kind: "sentiment"
      cadence: 6

  # --- FinRobot (multi-agent equity analyst) ---
  finrobot_analyst:
    family: finrobot
    enabled: true
    weight: 1.0
    kwargs:
      use_llm: false   # deterministic fallback unless OpenAI/DashScope key configured
      cadence: 6

  # --- DeepSeek-V4.1-Flash via OpenRouter ---
  # NOTE: DeepSeek-v4.1-Flash-DGX-Sparks on your PC is the GPU serving
  # stack — needs an actual DGX box. We hit the same weights via OpenRouter.
  deepseek_v41:
    family: deepseek
    enabled: true
    weight: 1.3
    kwargs:
      model: "deepseek/deepseek-chat"
      context_bars: 256
      cadence: 6

  # --- Statistical + gradient-boosted forecasters (optional, installable) ---
  # Each family ships with a graceful degradation contract: if the library is
  # missing the model still votes via a labelled momentum backfill (status
  # "mock").  Install:  pip install statsmodels scikit-learn xgboost
  #   lightgbm catboost pmdarima
  # Diverse personalities (window / mode / algo) produce independent votes.
  arima:
    family: arima
    enabled: true
    weight: 1.0
    kwargs: { lookback: 200, cadence: 3 }
  ets_damped:
    family: ets
    enabled: true
    weight: 0.9
    kwargs: { lookback: 200, cadence: 3 }
  auto_arima:
    family: auto_arima
    enabled: true
    weight: 1.0
    kwargs: { lookback: 150, cadence: 3 }
  svr_momentum:
    family: svr
    enabled: true
    weight: 0.8
    kwargs: { window: 24, mode: momentum, cadence: 2 }
  forest_extra:
    family: forest
    enabled: true
    weight: 0.9
    kwargs: { algo: extra, window: 32, n_estimators: 120, max_depth: 6, cadence: 2 }
  xgboost_slow:
    family: boost
    enabled: true
    weight: 1.0
    kwargs: { algo: xgboost, window: 32, n_estimators: 90, max_depth: 4, cadence: 3 }
  lightgbm_fast:
    family: boost
    enabled: true
    weight: 0.9
    kwargs: { algo: lightgbm, window: 48, n_estimators: 120, max_depth: 5, cadence: 2 }
  catboost_smooth:
    family: boost
    enabled: true
    weight: 0.9
    kwargs: { algo: catboost, window: 64, n_estimators: 80, max_depth: 6, cadence: 3 }

# -----------------------------------------------------------------------------
# Pattern recognition — candle + chart patterns
# -----------------------------------------------------------------------------
patterns:
  enabled: true
  lookback_chart: 60

# -----------------------------------------------------------------------------
# News — RSS feeds + sentiment
# -----------------------------------------------------------------------------
news:
  enabled: true
  poll_seconds: 180.0
  cache_ttl_seconds: 21600.0
  timeout_seconds: 10.0
  # Free RSS feeds (no API key required).
  feeds:
    forexfactory: "https://www.forexfactory.com/ffcal_week.xml"
    investing-fx: "https://www.investing.com/rss/forex.rss"
    investing-comm: "https://www.investing.com/rss/commodities.rss"
    fxstreet: "https://www.fxstreet.com/rss/news"
    marketwatch: "https://feeds.marketwatch.com/marketwatch/topstories/"
    reuters-biz: "https://feeds.reuters.com/reuters/businessNews"
    google-gold: "https://news.google.com/rss/search?q=gold+price+OR+XAUUSD&hl=en-US"
    google-oil: "https://news.google.com/rss/search?q=crude+oil+price+OR+OPEC&hl=en-US"
  # NewsAPI.org (optional, free tier 100 req/day). Leave blank to disable.
  newsapi_key: ""
  # Max age of news to count as relevant, seconds.
  max_age_seconds: 7200

# -----------------------------------------------------------------------------
# Market forces — intermarket macro (yfinance, free, 15-min delayed)
# -----------------------------------------------------------------------------
market_forces:
  enabled: true
  poll_seconds: 300.0
  history_days: 90
  forces:
    - { name: DXY,    yahoo: "DX-Y.NYB", kind: dollar }
    - { name: US10Y,  yahoo: "^TNX",     kind: yield }
    - { name: VIX,    yahoo: "^VIX",     kind: volatility }
    - { name: SPX,    yahoo: "^GSPC",    kind: equity }
    - { name: GOLD,   yahoo: "GC=F",     kind: metals }
    - { name: WTI,    yahoo: "CL=F",     kind: energy }
    - { name: COPPER, yahoo: "HG=F",     kind: metals }
    - { name: BTC,    yahoo: "BTC-USD",  kind: crypto }
    - { name: TIP,    yahoo: "TIP",      kind: reals }
    - { name: GDX,    yahoo: "GDX",      kind: miners }
    - { name: SLV,    yahoo: "SLV",      kind: metals }
    - { name: USO,    yahoo: "USO",      kind: energy }
    - { name: DBC,    yahoo: "DBC",      kind: comm }

# -----------------------------------------------------------------------------
# Commodities desk — investment-bank research panel for gold/metals/energy.
# Reads the <market_forces> tapes (DXY, real-yield proxy, VIX, Dr. Copper,
# oil, crowd positioning) and votes in the ensemble as source "desk".
# Validate its historical edge with: python -m jarvis_predict.commodities
# -----------------------------------------------------------------------------
desk:
  enabled: true
  min_score: 0.20     # |score| below this -> desk abstains (no directional vote)
  min_factors: 2      # at least N dominant-side factors must agree before firing
  long_score_extra: 0.08   # longs need |score| >= min_score+extra (weak long side)
  # Factors pruned by data (GET /desk/factors attribution, 250d XAUUSD, 3d horizon):
  #   VIX (0.43), XAU_SLV (0.42) were ANTI-correlated; US10Y (0.50), COPPER
  #   (0.49), WTI (0.49) were noise. Pruning lifted 3d hit-rate 0.567 -> 0.626
  #   on 120d and ~0.562 on 250d (verified 60/120/250d, verdict "edge").
  disabled_factors: [US10Y, COPPER, WTI, VIX, XAU_SLV]
                      # Tuned by historical sweep: 120d XAUUSD 58.8% hit (3d).

# -----------------------------------------------------------------------------
# Economic calendar — high-impact event blackout windows
# -----------------------------------------------------------------------------
calendar:
  enabled: true
  poll_seconds: 600.0
  blackout_pre_minutes: 30
  blackout_post_minutes: 30
  lookahead_days: 7
  lookback_days: 1

# -----------------------------------------------------------------------------
# Data pipeline — Parquet candle storage
# -----------------------------------------------------------------------------
data_pipeline:
  cache_size: 256
  feature_cache_ttl_seconds: 30.0

# -----------------------------------------------------------------------------
# OpenRouter — LLM reasoning layer over the 12+ model fleet.
# Provides DeepSeek-V4.1, DeepSeek-V3, GPT-4o, Claude 3.5, Llama 3.1, Gemini.
# =============================================================================
# ⚠ SECURITY: these keys are visible in this file. After setup, MOVE THEM
# OUT to environment variables (OPENROUTER_API_KEYS=key1,key2,...) or to a
# .env file outside version control. Rotate the keys at openrouter.ai
# if you ever committed this file.
# =============================================================================
openrouter:
  api_keys:
    - "sk-or-v1-REPLACE_WITH_YOUR_OPENROUTER_KEY_1"
    - "sk-or-v1-REPLACE_WITH_YOUR_OPENROUTER_KEY_2"
  base_url: "https://openrouter.ai/api/v1"
  timeout: 60.0
  max_retries: 4
  site_url: "https://jarvis.local"
  site_name: "Jarvis Reborn — MT5 Algo Trader"
  meta:
    # Default model + fallback chain for the meta-orchestrator.
    model: "deepseek/deepseek-chat"
    fallback_models:
      - "deepseek/deepseek-chat"
      - "openai/gpt-4o"
      - "meta-llama/llama-3.1-70b-instruct"
      - "openai/gpt-4o-mini"
    max_tokens: 2048
    prefer_openrouter: true

# -----------------------------------------------------------------------------
# Multi-timeframe hierarchical prediction
# -----------------------------------------------------------------------------
multi_timeframe:
  enabled: true
  timeframes: ["M5", "M15", "H1", "H4", "D1"]
  htf_set: { "H4": 0.4, "D1": 0.6 }           # weights for trend (sum=1)
  ltf_set: { "M5": 0.4, "M15": 0.3, "H1": 0.3 } # weights for entry timing (sum=1)
  confidence_boost_on_agreement: 1.5
  confidence_damp_on_disagreement: 0.3

# -----------------------------------------------------------------------------
# MT5 — MetaTrader 5 integration
# -----------------------------------------------------------------------------
mt5:
  terminal_path: "C:/Program Files/MetaTrader 5/terminal64.exe"
  # Execution mode: "paper" (journaled simulation on LIVE market data) or
  # "live" (real MT5 orders to the connected broker account).
  #   - Switch from the Web UI (MT5 card / Risk card) — a controlled restart
  #     applies it and persists the choice to {cache_dir}/execution_mode.json.
  #   - State file takes precedence, then execution_mode, then paper_mode.
  #   - Going LIVE requires explicit confirmation and a real (non-demo)
  #     broker login in MetaTrader.
  execution_mode: paper
  paper_mode: true
  # Symbols to monitor across all sectors. JS Global Capital symbols.
  symbols:
    - "EURUSD"
    - "GBPUSD"
    - "USDJPY"
    - "XAUUSD"
  timeframe: "M5"
  history_bars: 600
  poll_seconds: 2.0
  magic: 770001
  order:
    default_lot: 0.01
    sl_atr_multiple: 1.5
    tp_atr_multiple: 2.5
    max_open_positions: 3
    max_per_symbol: 1
    max_daily_loss: 50.0
  confirm_timeout: 60

# -----------------------------------------------------------------------------
# Autopilot — autonomous order execution.
# When enabled, a staged signal is auto-confirmed (sent to the bridge:
# simulated paper fill, or real MT5 order in LIVE mode) as soon as it clears
# the risk gates + these confidence gates. Manual confirm remains available
# (voice / tray / chat / HTTP) for stages that don't qualify, and you can
# pause it at any time from the UI or via POST /autopilot.
# -----------------------------------------------------------------------------
autopilot:
  enabled: true                 # auto-confirm staged signals
  min_confidence: 0.52          # ensemble confidence floor (0..1)
  min_agreement: 0.50           # fleet directional agreement floor (0..1)
  min_models: 3                 # minimum successful model forecasts required
  cooldown_s: 20                # minimum seconds between auto-orders per symbol

# -----------------------------------------------------------------------------
# Listener subsystem — voice / MT5 events / HTTP webhook
# -----------------------------------------------------------------------------
listener:
  voice:
    enabled: true
    wake_word: "jarvis"
    model_size: "base"
    language: "en"
    listen_seconds: 4.0
    sample_rate: 16000
    silence_hold: 1.2        # seconds of quiet before a one-shot capture ends
  hotkey:
    enabled: true
    combo: "ctrl+alt+j"      # global push-to-talk
  mt5_events:
    enabled: true
    tick_every: 30
    equity_drawdown_alert: 0.05
    alert_window_seconds: 300
  http:
    enabled: true
    bind_host: "127.0.0.1"
    port: 8765
    auth_token: "CHANGE_ME"

# -----------------------------------------------------------------------------
# Strategy Engine — ultra-sophisticated MT5 algo trader with hedging
# -----------------------------------------------------------------------------
strategy:
  enabled: true
  rsi_overbought: 70
  rsi_oversold: 30
  max_positions: 5
  max_daily_loss: 50.0
  max_drawdown_pct: 10.0
  hedge_enabled: true
  hedge_threshold_pct: 5.0
  confidence_weight: 0.6
  # MTF analysis TTL (seconds). The 4-timeframe confluence view is rebuilt at
  # most this often per symbol; exit/trail/hedge management still runs every
  # poll cycle. Lower = fresher, higher = cheaper/faster.
  analysis_ttl_seconds: 60

# -----------------------------------------------------------------------------
# Fleet scheduler — ultra-efficient polling cadence
# -----------------------------------------------------------------------------
fleet:
  # Default cadence (poll cycles) for LLM/network-backed model families
  # (fingpt, finrobot, deepseek). Set per model under `models:<name>.kwargs:
  # cadence:` to override. CPU models (timesfm, chronos, TA…) vote every cycle.
  llm_cadence: 6

# -----------------------------------------------------------------------------
# Cross-device / repo integration
# -----------------------------------------------------------------------------
devices:
  enabled: true
  state_path: ""              # defaults to ~/.jarvis/devices.json
  heartbeat_ttl_s: 60
  max_devices: 64
  bind_public: false          # set true to expose the UI on the LAN (0.0.0.0)

# -----------------------------------------------------------------------------
# Repo fabric — local quant/trading repos to integrate (LEAN, FinRL, qlib, …)
# -----------------------------------------------------------------------------
repos:
  enabled: true
  enabled_list: ["lean", "finrl", "qlib", "fingpt", "finrobot", "rdagent",
                 "tradecast", "timesfm", "chronos"]
  max_probe_workers: 5

# -----------------------------------------------------------------------------
# Agent swarm — coordinated prediction cortex + token-aware compute routing
# -----------------------------------------------------------------------------
agents:
  enabled: true
  cache_ttl: 4.0             # seconds a swarm decision stays valid per symbol
  max_workers: 8
  min_confidence: 0.20       # below this the swarm abstains (no signal)
  learner_window: 120        # rolling observations per model/agent
  learner_min_samples: 8
  risk:
    max_open_positions: 3
    max_daily_loss: 50.0
    drawdown_threshold: 0.05

# -----------------------------------------------------------------------------
# UI / watchdog
# -----------------------------------------------------------------------------
ui:
  tray: true
  watchdog: true
  max_restarts_per_hour: 10
  status_refresh_seconds: 3

logging:
  level: "INFO"
  rotate_mb: 10
  keep_files: 5
