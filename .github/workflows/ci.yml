name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install (core + test extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Lint (compileall — catches syntax errors)
        run: python -m compileall -q kairos

      - name: Import smoke test (no network required)
        run: python -c "import kairos; print('kairos', kairos.__version__)"

      - name: Run tests
        run: pytest

      - name: CLI help
        run: python -m kairos --help
